[package]
name = "ascii-engine-lab"
version = "0.1.0"
edition = "2021"
description = "Direct semantic glyph rendering laboratory; no mesh-world framebuffer"
license = "MIT"

[dependencies]
wgpu = "=26.0.1"
winit = "=0.30.12"
glam = "=0.30.9"
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "0.4"
font8x8 = "0.3"
png = "0.17.16"
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
