[package]
name = "ascii-material-room"
version = "0.1.0"
edition = "2021"
default-run = "ascii-material-room"
description = "Independent, data-driven client of the experimental ASCII renderer"
license = "MIT"

[dependencies]
ascii-render = { path = "../../crates/ascii-render" }
glam = "=0.30.9"
serde_json = "1.0"
pollster = "0.4"
winit = "=0.30.12"

[dev-dependencies]
# Frozen R11 compositor oracle, exercised against this client's real v1/v2 data.
rayon = "=1.11.0"
bytemuck = "=1.25.2"
